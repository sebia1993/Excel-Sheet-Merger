name: GUI lifecycle diagnostics (isolated branch)
on:
  push:
    branches: [stability/gui-lifecycle-round12]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-build.txt
      - name: Collect source and pinned pure Python dependencies for offline reproduction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostic | Out-Null
          git archive --format=zip -o diagnostic/source.zip HEAD
          python -m pip download --no-deps --dest diagnostic ttkbootstrap==2.2.6 xlrd==2.0.2
      - name: Capture actual Tcl background and Python callback errors
        shell: pwsh
        run: |
          @'
          import json, sys, tkinter as tk, traceback, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          errors = []
          original_init = tk.Tk.__init__
          def traced_init(self, *args, **kwargs):
              original_init(self, *args, **kwargs)
              def record(message, details):
                  errors.append({'message': str(message), 'details': str(details)})
                  print('ESM_BGERROR:', message, details, file=sys.stderr)
                  return ''
              self.tk.createcommand('esm_record_bgerror', record)
              self.tk.eval('proc bgerror {message} {esm_record_bgerror $message $::errorInfo}')
          tk.Tk.__init__ = traced_init
          def callback_error(self, kind, value, tb):
              detail = ''.join(traceback.format_exception(kind, value, tb))
              errors.append({'message': str(value), 'details': detail})
              print('ESM_CALLBACK_ERROR:', detail, file=sys.stderr)
          tk.Tk.report_callback_exception = callback_error
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          Path('diagnostic/tcl-errors.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2), encoding='utf-8')
          print('ESM_DIAGNOSTIC_SUMMARY:', json.dumps({'tests': result.testsRun, 'test_success': result.wasSuccessful(), 'background_errors': errors}, ensure_ascii=False))
          sys.exit(0 if result.wasSuccessful() and not errors else 1)
          '@ | Set-Content -Encoding utf8 diagnostic/run_diagnostic.py
          python diagnostic/run_diagnostic.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gui-lifecycle-diagnostic
          path: diagnostic/
          retention-days: 7
