name: Windows 11 Python EXE 빌드 및 릴리즈

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'src/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install Windows build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate pinned dependencies and capture environment
        shell: pwsh
        run: |
          python -m pip check
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m pip freeze | Set-Content -Encoding ascii dist/BUILD_DEPENDENCIES.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify themed GUI and Excel readers
        run: python -c "from ttkbootstrap import Style; import xlrd; print('ttkbootstrap + xlrd OK')"

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ExcelSheetMerger --paths src --collect-submodules openpyxl --collect-submodules xlrd --collect-all ttkbootstrap app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/ExcelSheetMerger.exe')) { throw 'EXE not found' }
          $exe = [System.IO.File]::ReadAllBytes('dist/ExcelSheetMerger.exe')
          if ($exe.Length -lt 100000 -or $exe[0] -ne 77 -or $exe[1] -ne 90) { throw 'Invalid Windows PE executable' }
          $hash = (Get-FileHash 'dist/ExcelSheetMerger.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ExcelSheetMerger.exe" | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Smoke-test the packaged EXE (real CSV and XLSX merge)
        shell: pwsh
        run: |
          foreach ($iteration in 1..10) {
            $result = Join-Path $env:RUNNER_TEMP "excel-merger-self-test-$iteration.txt"
            $proc = Start-Process -FilePath (Resolve-Path 'dist/ExcelSheetMerger.exe') -ArgumentList @('--self-test', $result) -PassThru
            if (-not $proc.WaitForExit(120000)) {
              $proc.Kill()
              throw 'Packaged EXE smoke test timed out'
            }
            if ($proc.ExitCode -ne 0 -or -not (Test-Path $result)) { throw "Packaged EXE smoke failed ($($proc.ExitCode))" }
            $content = Get-Content $result -Raw
            if ($content -notmatch '^PASS:') { throw "Packaged EXE smoke failed: $content" }
            Write-Host "Run $iteration : $content"
          }

      - name: Publish EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSheetMerger-Windows11-x64
          path: |
            dist/ExcelSheetMerger.exe
            dist/SHA256SUMS.txt
            dist/BUILD_DEPENDENCIES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.$env:GITHUB_RUN_NUMBER"
          gh release create $tag 'dist/ExcelSheetMerger.exe' 'dist/SHA256SUMS.txt' 'dist/BUILD_DEPENDENCIES.txt' --target $env:GITHUB_SHA --title "Excel Sheet Merger $tag" --notes-file 'RELEASE_NOTES.md' --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
